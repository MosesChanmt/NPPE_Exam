                    />
                  </div>

                  {genMode === 'gemini-app-paste' ? (
                    <div className="space-y-4 bg-slate-950/90 border border-emerald-500/30 rounded-2xl p-5">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div>
                          <p className="text-xs sm:text-sm font-bold text-emerald-300">
                            步驟 1：複製下面由你嘅 System Prompt 模板即時合成嘅完整指令，貼去 Gemini App
                          </p>
                          <p className="text-[11px] text-slate-400">
                            （想改個 Prompt 本身？撳上面「🛠️ 管理 / 自訂 System Prompt 模板」即可隨時直接修改！）
                          </p>
                        </div>
                        <button
                          onClick={() =>
                            copyTextToClipboard(
                              buildCrispTrickyGenerationPrompt(genCount, genTopicId),
                              `📋 已複製 ${genCount} 題「案例應用 + 精煉概念 Prompt」！請貼去 Gemini App！`
                            )
                          }
                          className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-lg"
                        >
                          📋 一鍵複製 Prompt 去 Gemini App
                        </button>
                      </div>

                      <textarea
                        readOnly
                        rows={6}
                        value={buildCrispTrickyGenerationPrompt(genCount, genTopicId)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-[11px] text-slate-300 font-mono"
                      />

                      <div className="pt-2 border-t border-slate-800 space-y-2">
                        <p className="text-xs sm:text-sm font-bold text-indigo-300">
                          步驟 2：將 Gemini App 生成嘅 JSON Array 貼落下面，一鍵導入題庫！
                        </p>
                        <textarea
                          rows={5}
                          value={pastedJsonText}
                          onChange={e => setPastedJsonText(e.target.value)}
                          placeholder='將 Gemini App 回覆嘅 [ { "topicId": "II", "question": "...", "options": [...] } ] 貼喺呢度...'
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white font-mono"
                        />
                        <button
                          onClick={handleImportPastedQuestions}
                          className="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-sm font-extrabold shadow-lg transition"
                        >
                          📥 立即解析 JSON 並寫入題庫 (自動去重 + 自動加時)
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {isGeneratingQs && qBatchProgress && (
                        <div className="bg-indigo-950/50 border border-indigo-500/40 rounded-2xl p-4 text-xs text-indigo-200">
                          ⏳ 正在透過低 RPM 大批次模式生成中：已完成 {qBatchProgress.completed} / {qBatchProgress.total} 題...
                        </div>
                      )}
                      <button
                        onClick={() => handleDirectApiGenerateQuestions(genCount, false)}
                        disabled={isGeneratingQs}
                        className="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 disabled:opacity-50 text-white font-extrabold text-sm shadow-xl transition"
                      >
                        {isGeneratingQs
                          ? '⏳ AI 生成中...'
                          : `⚡ 使用 API 一次過生成 ${genCount} 條精煉 Tricky 題目`}
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* Slide-Over 24/7 AI Tutor Drawer */}
          {isTutorDrawerOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm">
              <div className="w-full max-w-xl bg-slate-900 border-l border-slate-800 h-full flex flex-col shadow-2xl">
                <div className="p-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
                  <div>
                    <h3 className="text-sm sm:text-base font-bold text-white">🤖 NPPE 24/7 AI 導師</h3>
                    <p className="text-xs text-slate-400">中英對照拆解倫理學派、次序陷阱與工程法案例</p>
                  </div>
                  <button
                    onClick={() => setIsTutorDrawerOpen(false)}
                    className="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold"
                  >
                    ✕ 關閉
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                  {tutorMessages.map((m, i) => (
                    <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div
                        className={`max-w-[88%] rounded-2xl p-3.5 text-xs sm:text-sm whitespace-pre-line leading-relaxed ${
                          m.role === 'user'
                            ? 'bg-indigo-600 text-white'
                            : 'bg-slate-950 border border-slate-800 text-slate-200'
                        }`}
                      >
                        {m.text}
                      </div>
                    </div>
                  ))}
                  {isTutorLoading && (
                    <div className="text-xs text-indigo-300 p-3 bg-slate-950 rounded-xl border border-slate-800">
                      ⏳ AI 導師正在分析中...
                    </div>
                  )}
                </div>

                <form onSubmit={handleSendTutorMessage} className="p-4 bg-slate-950 border-t border-slate-800 flex gap-2">
                  <input
                    type="text"
                    value={tutorInput}
                    onChange={e => setTutorInput(e.target.value)}
                    placeholder="輸入問題 (如：Deontology 同 Ethical relativism 點分？)..."
                    className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white"
                  />
                  <button
                    type="submit"
                    className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold"
                  >
                    發送
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
