    function extractNormalizedTokens(text) {
      if (!text) return [];
      return text
        .toLowerCase()
        .replace(/scenario\s*#?\d+\s*:/gi, ' ')
        .replace(/\$?\d+([,\.]\d+)*/g, ' ')
        .replace(/[^a-z\s]/g, ' ')
        .split(/\s+/)
        .filter(w => w.length > 3 && !COMMON_IGNORE_WORDS.has(w));
    }

    function calculateTokenSimilarity(tokensA, tokensB) {
      if (!tokensA.length || !tokensB.length) return 0;
      const setA = new Set(tokensA);
      const setB = new Set(tokensB);
      let intersection = 0;
      for (const t of setA) {
        if (setB.has(t)) intersection++;
      }
      const union = setA.size + setB.size - intersection;
      return union === 0 ? 0 : intersection / union;
    }

    function filterAndDeduplicateQuestions(candidateQuestions, existingQuestions = [], similarityThreshold = 0.54) {
      const accepted = [];
      let rejectedCount = 0;
      const comparisonPool = existingQuestions.map(q => ({
        id: q.id,
        stemTokens: extractNormalizedTokens(q.question),
        correctOptTokens: extractNormalizedTokens(q.options?.[q.correctIndex] || '')
      }));

      for (const cand of candidateQuestions) {
        const candStemTokens = extractNormalizedTokens(cand.question);
        const candOptTokens = extractNormalizedTokens(cand.options?.[cand.correctIndex] || '');
        let isDuplicate = false;

        for (const existing of comparisonPool) {
          const stemSim = calculateTokenSimilarity(candStemTokens, existing.stemTokens);
          const optSim = calculateTokenSimilarity(candOptTokens, existing.correctOptTokens);
          if (stemSim >= similarityThreshold || (stemSim >= 0.38 && optSim >= 0.72)) {
            isDuplicate = true;
            break;
          }
        }

        if (isDuplicate) {
          rejectedCount++;
        } else {
          accepted.push(cand);
          comparisonPool.push({
            id: cand.id,
            stemTokens: candStemTokens,
            correctOptTokens: candOptTokens
          });
        }
      }
      return { accepted, rejectedCount };
    }

    function cleanOptionBody(optStr) {
      return (optStr || '').replace(/^[A-D][\.\)]\s*/i, '').trim();
    }

    // Clean Option Formatter: Preserves crisp, short options without adding artificial clauses!
    function normalizeAndBalanceQuestionOptions(questionObj) {
      if (!questionObj || !Array.isArray(questionObj.options) || questionObj.options.length < 4) {
        return questionObj;
      }
      const letters = ['A', 'B', 'C', 'D'];
      const bodies = questionObj.options.slice(0, 4).map(cleanOptionBody);
      return {
        ...questionObj,
        options: bodies.map((b, i) => `${letters[i]}. ${b}`)
      };
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const CRISP_107_BLUEPRINTS = [
      ['I', 'What is the primary statutory mandate of provincial engineering regulatory associations in Canada?', 'A. Protecting the public interest by regulating the practice of engineering', 'B. Advocating for improved compensation and working conditions for engineers', 'C. Publishing national technical building codes and product standards', 'D. Mediating commercial fee disputes between consultants and clients', 0, 'Provincial regulators (like PEO) exist by statute strictly to protect the public interest through self-regulation.', '【正解：A】各省工程師學會（如 PEO）嘅唯一法定使命係「規管工程執業以保障公眾利益」。B 係倡議組織（如 OSPE）嘅角色。'],
      ['I', 'How does Canadian engineering legislation differ from a pure "Right to Title" registration system?', 'A. It restricts both the use of the title and the scope of engineering practice', 'B. It allows unlicensed graduates to practice independently if they avoid using the title', 'C. It grants national licensure through the federal government', 'D. It exempts licensed engineers from civil tort liability', 0, 'Canadian engineering statutes protect both the exclusive right to title (P.Eng.) and the exclusive scope of practice.', '【正解：A】加拿大工程法同時保護「專屬頭銜 (Right to Title)」同「專屬執業權 (Exclusive Scope of Practice)」，無牌執業就算唔自稱 P.Eng. 都屬違法。'],
      ['I', 'What is the primary role of Engineers Canada in relation to provincial and territorial regulators?', 'A. Accrediting undergraduate engineering programs and developing national guidelines', 'B. Issuing national engineering licenses valid across all provinces', 'C. Conducting disciplinary appeals for revoked provincial licenses', 'D. Enforcing provincial occupational health and safety statutes', 0, 'Engineers Canada accredits university programs (via CEAB) and develops national guidelines, but has no statutory power to license or discipline engineers.', '【正解：A】Engineers Canada 負責大學學位認證（CEAB）同制定全國指引，但絕對無權發牌或處分工程師（發牌屬省級權力）。'],
      ['I', 'Under Ontario’s Professional Engineers Act, what does the "Industrial Exception" permit an unlicensed employee to do?', 'A. Design public infrastructure if employed by a crown corporation', 'B. Perform work strictly on machinery used internally within their employer’s manufacturing plant', 'C. Seal engineering drawings for external clients under corporate insurance', 'D. Use the title Professional Engineer strictly on internal company emails', 1, 'The industrial exception applies narrowly to internal plant machinery used to manufacture products, never to public engineering services or title usage.', '【正解：B】工業豁免（Industrial Exception）只限於工廠內部生產設備嘅操作與維護，絕不包括向外界提供工程服務或使用 P.Eng. 頭銜。'],
      ['I', 'What does the Iron Ring (Calling of an Engineer) ceremony legally confer upon an engineering graduate?', 'A. A provisional license to practice engineering for 12 months', 'B. No legal authority; it is a voluntary moral commitment to professional humility', 'C. Automatic membership in the provincial regulatory association', 'D. Immunity from disciplinary investigation during internship', 1, 'The Ritual of the Calling of an Engineer is a voluntary moral commitment and confers no legal licensure or statutory authority.', '【正解：B】鐵戒儀式（Iron Ring）只係道德與專業謙卑嘅象徵承諾，並無賦予任何法定執業牌照權力。'],
      ['I', 'Why do provincial engineering regulatory councils include government-appointed lay members (non-engineers)?', 'A. To audit the technical accuracy of structural calculations', 'B. To represent the public interest and ensure regulatory accountability', 'C. To negotiate government infrastructure contracts for members', 'D. To serve as legal defense counsel for accused engineers', 1, 'Lay councillors represent the public perspective and prevent self-regulation from becoming self-serving.', '【正解：B】加入非工程界嘅公眾委員（Lay members）係為咗代表公眾利益並確保專業自治公開透明。'],
      ['I', 'An engineer licensed in Alberta is hired to seal permanent foundation drawings for a building in Ontario. What is required first?', 'A. Obtaining licensure or a temporary license from the Ontario regulator', 'B. Notifying Engineers Canada within 30 days of sealing the drawings', 'C. Co-signing the drawings with an Ontario general contractor', 'D. Purchasing federal interprovincial liability insurance', 0, 'Regulation is provincial; an engineer must be licensed by the host province’s regulator before practicing there.', '【正解：A】跨省執業必須先向工程所在地嘅省級監管機構（如安省 PEO）申請正式牌照或臨時牌照（Temporary License）。'],
      ['I', 'What primary failure was identified in the 1907 Quebec Bridge collapse inquiry?', 'A. Brittle fracture caused by sub-zero winter temperatures', 'B. Divided responsibility and failure to verify dead-load recalculations', 'C. Deliberate use of counterfeit steel rivets by subcontractors', 'D. Unforeseen seismic activity along the St. Lawrence River', 1, 'The Quebec Bridge collapsed due to underestimated self-weight, divided authority between field and office engineers, and ignoring bent chords.', '【正解：B】1907年魁北克大橋倒塌源於死載重計算失誤、現場與辦公室工程師權責不清、以及無視構件變形警告。'],
      ['I', 'What is the primary purpose of mandatory Continuing Professional Development (CPD) programs?', 'A. Generating operational revenue for provincial regulators', 'B. Ensuring practitioners maintain ongoing technical and ethical competence', 'C. Replacing the need for professional liability insurance', 'D. Qualifying engineers for automatic Consulting Engineer designation', 1, 'CPD programs (such as PEO’s PEAK) ensure practitioners maintain competence to safeguard the public throughout their careers.', '【正解：B】持續專業進修（CPD / PEAK）旨在確保工程師拎牌後持續維持技術與倫理勝任能力，保障公眾安全。'],
      ['I', 'In the 2012 Elliot Lake Algo Centre Mall roof collapse inquiry, what major ethical failure was highlighted?', 'A. Altering inspection reports under client pressure to downplay severe steel rust', 'B. Designing the roof without computer finite element software', 'C. Delegating concrete testing to a licensed technologist', 'D. Failing to register a construction lien before the mall was sold', 0, 'Engineers allowed client financial pressure to influence their inspection report, removing references to long-term water leakage and corrosion.', '【正解：A】Elliot Lake 商場塌頂慘劇揭示工程師屈服於業主壓力而刪改驗樓報告，淡化長年漏水與鋼結構嚴重鏽蝕。'],

      ['II', 'When an engineer’s duty of loyalty to an employer conflicts with the protection of public safety, which duty prevails?', 'A. Duty of confidentiality under the employment contract', 'B. Paramount duty to safeguard public life, health, and welfare', 'C. Joint decision determined by corporate legal counsel', 'D. Neutrality until the regulatory body issues an order', 1, 'Under the Code of Ethics, the duty to safeguard public safety and welfare is paramount and overrides loyalty or confidentiality to an employer.', '【正解：B】保障公眾生命、健康與安全（Paramount duty to public welfare）永遠排第一，凌駕於對僱主嘅忠誠與保密義務之上。'],
      ['II', 'An engineer discovers an imminent toxic leak that her immediate manager refuses to fix. What is the next appropriate step?', 'A. Contact local news media immediately to warn the public', 'B. Escalate the issue internally to senior management or the board of directors', 'C. Resign immediately to avoid personal legal liability', 'D. Wait until the next annual regulatory audit to report it', 1, 'Whistleblowing protocol requires exhausting internal escalation channels (senior management / board) before reporting to external authorities.', '【正解：B】吹哨者程序（Whistleblowing）：當直屬上司拒絕處理時，下一步必須先向公司高層或董事局（Internal escalation）升級通報，仍無效先向政府部門舉報。'],
      ['II', 'Which ethical theory evaluates actions based on producing the greatest net benefit for the greatest number of people?', 'A. Deontology', 'B. Utilitarianism', 'C. Virtue ethics', 'D. Rights ethics', 1, 'Utilitarianism (John Stuart Mill) focuses on outcomes/consequences that maximize overall utility for the majority.', '【正解：B】Utilitarianism（功利主義 - Mill）以結果為導向，追求「最大多數人嘅最大利益」。'],
      ['II', 'Which ethical framework focuses on developing moral character, integrity, and the "Golden Mean" rather than strict rules or outcomes?', 'A. Virtue ethics', 'B. Ethical egoism', 'C. Utilitarianism', 'D. Contractarianism', 0, 'Virtue ethics (Aristotle) centers on the moral character and virtues of the individual.', '【正解：A】Virtue ethics（美德倫理 - 亞里士多德）強調個人品格修養與中庸之道。'],
      ['II', 'Which ethical theory holds that fundamental individual moral entitlements cannot be violated even to benefit the majority?', 'A. Utilitarianism', 'B. Rights-based ethics', 'C. Ethical relativism', 'D. Situational ethics', 1, 'Rights ethics (John Locke) protects fundamental individual rights to life, liberty, and safety against majority utility.', '【正解：B】Rights-based ethics（權利倫理 - 洛克）強調個人基本人權不可因為多數人利益而被犧牲。'],
      ['II', 'An engineer evaluating municipal tenders realizes a bidder is owned by his brother-in-law. What must the engineer do?', 'A. Score the bids blindly without informing the municipality', 'B. Disclose the conflict of interest in writing immediately and offer to recuse himself', 'C. Disqualify the brother-in-law’s bid to prevent perceived bias', 'D. Ask another colleague to sign the evaluation sheet on his behalf', 1, 'Perceived or potential conflicts of interest require immediate, full written disclosure to the client/employer and recusal unless informed consent is given.', '【正解：B】遇到利益衝突（包括親屬關係），必須立即向客戶/僱主作出全面書面申報（Full written disclosure）並主動提出避席。'],
      ['II', 'When is a full-time employed engineer ethically permitted to accept outside consulting work ("moonlighting")?', 'A. Whenever the work is performed strictly on weekends at home', 'B. When there is no conflict of interest, employer resources are not used, and the employer is informed', 'C. Only after obtaining written permission from Engineers Canada', 'D. Never; salaried engineers are prohibited from outside work', 1, 'Ethical moonlighting requires avoiding conflicts of interest, never using employer software/resources without consent, informing the employer, and holding a C of A if serving the public.', '【正解：B】合規兼職（Moonlighting）條件：不與正職構成利益衝突、不私用公司電腦/軟件、通知僱主（並須持有 C of A 方可向公眾提供服務）。'],
      ['II', 'A client asks Engineer B to review structural drawings previously sealed by Engineer A. What is Engineer B’s ethical duty?', 'A. Decline the work because reviewing another engineer’s design is unethical', 'B. Conduct an objective review without maliciously injuring Engineer A’s reputation', 'C. Modify Engineer A’s sealed drawings directly without notification', 'D. Report Engineer A to the Discipline Committee before starting the review', 1, 'Peer reviews are completely ethical provided the reviewing engineer acts objectively and does not maliciously injure the other practitioner’s reputation.', '【正解：B】工程師可以接受委託審核同行設計，但必須保持客觀專業，不得惡意中傷同行聲譽。'],
      ['II', 'While managing a project abroad, a foreign customs official demands an unofficial cash payment to release equipment. What must a Canadian P.Eng. do?', 'A. Pay the fee since local business customs supersede Canadian rules abroad', 'B. Refuse the payment as bribery violates Canadian law (CFPOA) and engineering ethics', 'C. Instruct a local subcontractor to make the payment indirectly', 'D. Record the payment as an expedited inspection surcharge', 1, 'Under Canada’s Corruption of Foreign Public Officials Act (CFPOA) and the Code of Ethics, bribery abroad directly or through agents is illegal and unethical.', '【正解：B】根據加拿大《反海外腐敗法》(CFPOA) 及倫理守則，即使身處海外，直接或經中介行賄外國官員均屬違法及專業失德。'],
      ['II', 'When an engineer leaves Firm X to join Competitor Y, what may the engineer ethically take and use at the new job?', 'A. General engineering knowledge, skill, and professional experience acquired', 'B. Unreleased CAD templates developed exclusively by Firm X', 'C. Confidential client contact lists and pricing spreadsheets', 'D. Proprietary source code written for Firm X’s clients', 0, 'An employee may take their general skills, knowledge, and experience, but trade secrets, client lists, and proprietary templates remain confidential.', '【正解：A】轉工時可帶走個人通用工程知識與經驗，但前僱主嘅商業機密、客戶名單與專屬圖紙模板仍受保密義務保護。'],
      ['II', 'How long does an engineer’s ethical duty of confidentiality regarding a client’s proprietary information last?', 'A. Until final payment of the consulting invoice is received', 'B. Indefinitely, surviving termination of the contract or employment', 'C. For the 2-year basic limitation period after project completion', 'D. For 5 years under provincial regulatory bylaws', 1, 'The duty of confidentiality continues indefinitely after the professional relationship ends, unless waived by the client or required by law.', '【正解：B】保密義務喺合約完成或離職後仍然無限期持續有效（除非獲客戶同意或法律強制披露）。'],
      ['II', 'An electrical engineer with no geotechnical training is asked by a friend to seal a deep excavation shoring design. What must the engineer do?', 'A. Seal the design after reviewing a standard geotechnical textbook', 'B. Decline the work because engineers may only practice within their area of competence', 'C. Seal the drawings accompanied by a limited liability disclaimer', 'D. Have the friend sign an indemnity waiver before sealing', 1, 'Practicing outside one’s area of training and competence violates the Code of Ethics and constitutes professional misconduct.', '【正解：B】工程師只可承接自己具備足夠訓練與經驗（Competence）嘅工程範疇，跨界盲目蓋印屬專業失德。'],
      ['II', 'When making a public technical statement at a municipal hearing on behalf of a developer, what must an engineer disclose?', 'A. The exact hourly fee charged to the developer', 'B. The identity of the interested party on whose behalf the engineer is speaking', 'C. The names of all competing developers in the municipality', 'D. Personal political party affiliations', 1, 'Engineers making public statements must be objective, base views on adequate knowledge, and clearly disclose on whose behalf they are speaking.', '【正解：B】代表特定利益方喺公眾場合發表技術意見時，必須清楚申報自己代表邊個機構或客戶發言。'],
      ['II', 'A vendor sends an engineer a $10 promotional calendar with the vendor’s logo at year-end. How is this treated ethically?', 'A. Nominal promotional items of minimal value are acceptable if judgment is unaffected', 'B. It must be reported to the Discipline Committee as an illegal kickback', 'C. It requires the vendor to be disqualified from future bidding', 'D. It requires written approval from the provincial registrar', 0, 'Nominal promotional items of minimal value (pens, calendars) do not violate ethics unless prohibited by employer policy, unlike cash or lavish gifts.', '【正解：A】收受價值極低嘅宣傳紀念品（如日曆、原子筆）而唔影響專業判斷一般係允許嘅，但現金、回佣或豪華招待則嚴禁。'],
      ['II', 'An engineer discovers she made a calculation error that will increase construction costs. What is the appropriate ethical action?', 'A. Conceal the error inside an unrelated contractor change order', 'B. Promptly disclose the error to the client and notify the liability insurer', 'C. Wait to see if the contractor notices the error during construction', 'D. Resign from the project without billing for the design phase', 1, 'Fidelity and candor require promptly informing the client of significant errors and notifying the firm’s professional liability insurer.', '【正解：B】發現設計失誤時，誠信原則要求及時向客戶坦誠交代並提出修正方案，同時通知專業責任保險公司。'],

      ['III', 'Under what condition may a licensed engineer legally seal drawings prepared by an unlicensed third-party designer outside the engineer’s supervision?', 'A. Under no circumstances; third-party drawings can never be sealed', 'B. Only after performing a thorough, independent review and recalculation of the entire design', 'C. When the designer signs a notarized warranty of accuracy', 'D. When the engineer adds a note stating "Sealed for permit submission only"', 1, 'To avoid illegal plan stamping, an engineer taking over external work must thoroughly recalculate and verify the entire design and assume full responsibility.', '【正解：B】接手非自己監督嘅第三方圖紙時，唯一合法蓋印嘅條件係由頭到尾進行全面、獨立嘅重新計算與核實，並承擔 100% 責任。'],
      ['III', 'How should an engineer handle incomplete draft drawings issued to a client for preliminary cost estimation?', 'A. Affix the professional seal and date them as preliminary', 'B. Do not seal the drawings and clearly mark them "Preliminary – Not for Construction"', 'C. Affix the seal without a signature to indicate draft status', 'D. Have an engineering intern seal the draft drawings', 1, 'Draft or incomplete documents must never be sealed and should be clearly labeled "Preliminary / Not for Construction."', '【正解：B】未完成嘅草稿（Draft / Preliminary）絕對唔可以蓋 P.Eng. 印章，並應清楚註明「Not for Construction」。'],
      ['III', 'By what benchmark do Canadian courts evaluate whether an engineer breached the "Reasonable Standard of Care"?', 'A. Guaranteeing absolute perfection and zero defects in the final structure', 'B. The skill and diligence of an ordinary competent engineer practicing at the time the work was done', 'C. Compliance with updated building codes enacted ten years after construction', 'D. The performance of the highest-paid international expert in that specialty', 1, 'Engineers are not held to perfection or hindsight; they are judged by the competence of an ordinary reasonable practitioner at the time of the work.', '【正解：B】法庭唔要求 100% 完美（Perfection），亦唔會用事後孔明；而係以「當年設計時一般稱職工程師應有嘅謹慎水平」為準。'],
      ['III', 'What are the three fundamental rights of workers under Canadian Occupational Health and Safety (OH&S) legislation?', 'A. Right to know, right to participate, and right to refuse unsafe work', 'B. Right to overtime pay, right to unionize, and right to severance', 'C. Right to sue the employer in tort, right to free tools, and right to remote work', 'D. Right to vet corporate directors, right to profit sharing, and right to paid leave', 0, 'Canadian OHSA is built on the Right to Know about hazards, the Right to Participate in safety, and the Right to Refuse unsafe work.', '【正解：A】職安健（OHSA）勞工三大基本權利：知情權（Right to Know）、參與權（Right to Participate）、拒絕危險工作權（Right to Refuse Unsafe Work）。'],
      ['III', 'What is the primary legal defense available to an engineer or corporation charged with a "Strict Liability" regulatory offence under environmental or OH&S statutes?', 'A. Due diligence (proving all reasonable preventative care was taken)', 'B. Lack of personal intent to cause harm (mens rea)', 'C. Privity of contract with the general contractor', 'D. Equitable estoppel based on past inspections', 0, 'For strict liability regulatory offences, the accused can defend themselves by proving Due Diligence on a balance of probabilities.', '【正解：A】面對環保法或職安健嘅嚴格責任控罪（Strict Liability Offences），最核心嘅法定抗辯理由係證明已盡「應盡努力 / 合理謹慎 (Due Diligence)」。'],
      ['III', 'In safety engineering, what is the most effective measure at the very top of the "Hierarchy of Controls"?', 'A. Personal Protective Equipment (PPE)', 'B. Elimination of the hazard', 'C. Administrative warning signs and safety training', 'D. Engineering machine guards', 1, 'Hierarchy of Controls from most to least effective: 1. Elimination -> 2. Substitution -> 3. Engineering Controls -> 4. Administrative Controls -> 5. PPE.', '【正解：B】安全控制層級最高、最有效嘅永遠係「徹底消除危險源 (Elimination)」，而個人防護裝備（PPE）係最後一道防線。'],
      ['III', 'What critical lesson regarding safety-critical systems was established by the Therac-25 radiation therapy accidents?', 'A. Software alone should never replace independent hardware safety interlocks', 'B. Open-source operating systems are immune to race conditions', 'C. Radiation shielding must be constructed exclusively of lead', 'D. Operators should override recurring software error codes manually', 0, 'Therac-25 showed that relying solely on software without independent hardware safety interlocks in life-critical systems can be fatal.', '【正解：A】Therac-25 醫療輻射機慘劇教訓：喺生死攸關嘅系統中，絕不能移除獨立硬件安全聯鎖（Hardware interlocks）而單靠軟件把關。'],
      ['III', 'What is the primary difference between ISO 9001 and ISO 14001 standards?', 'A. ISO 9001 governs quality management systems; ISO 14001 governs environmental management systems', 'B. ISO 9001 applies to software code; ISO 14001 applies to structural steel', 'C. ISO 9001 is mandatory by statute; ISO 14001 is for financial auditing', 'D. ISO 9001 covers occupational safety; ISO 14001 covers intellectual property', 0, 'ISO 9001 specifies Quality Management Systems (QMS); ISO 14001 specifies Environmental Management Systems (EMS).', '【正解：A】ISO 9001 係品質管理系統（Quality Management）；ISO 14001 係環境管理系統（Environmental Management）。'],
      ['III', 'What is the primary purpose of conducting a Failure Modes and Effects Analysis (FMEA) during design?', 'A. Calculating liquidated damages after a project schedule delay', 'B. Proactively identifying potential component failures and their system impacts', 'C. Determining which subcontractor is liable in a tort lawsuit', 'D. Auditing project invoices for tax compliance', 1, 'FMEA is a proactive, systematic engineering method to identify potential failure modes, their causes, and their severity/effects on the system.', '【正解：B】FMEA（失效模式與影響分析）係事前預防性工具，系統化找出組件可能故障嘅模式及其對系統安全嘅影響。'],
      ['III', 'Under Ontario’s Environmental Protection Act, what must a practitioner do if an industrial spill discharges pollutants into the natural environment?', 'A. Report the spill forthwith to the Ministry of the Environment and take immediate containment action', 'B. Wait 30 days to see if natural remediation occurs before reporting', 'C. Report the spill only if the cleanup cost exceeds $100,000', 'D. Keep the spill confidential under the client’s non-disclosure agreement', 0, 'Environmental legislation mandates immediate ("forthwith") reporting of spills to the Ministry and immediate containment/remediation.', '【正解：A】發生環境污染洩漏（Spill）時，法例規定必須即時（Forthwith）向環境部通報並立即採取圍堵清理措施。'],
      ['III', 'What is the legal difference between "As-Built Drawings" and "Record Drawings"?', 'A. As-Built drawings record field markups by the contractor; Record Drawings are compiled by the engineer', 'B. Record Drawings are prepared before bidding; As-Built drawings are used for permits', 'C. As-Built drawings must be sealed by the property owner', 'D. There is no distinction between the two terms in practice', 0, 'Contractors mark up As-Built changes on site; engineers compile Record Drawings (and should not blindly certify unverified contractor field work).', '【正解：A】As-Built 由承建商現場標記改動；Record Drawings 由工程師整理歸檔（工程師須註明未經親自核實嘅隱蔽數據範圍）。'],
      ['III', 'When an engineer reviews and stamps contractor "Shop Drawings," what is the standard scope of that review?', 'A. Reviewing for general conformance with the design concept and specifications', 'B. Assuming full responsibility for contractor fabrication dimensions and site safety methods', 'C. Approving extra contract price increases automatically', 'D. Relieving the contractor of all warranty obligations', 0, 'Shop drawing review checks general conformance with the design intent; the contractor remains responsible for exact dimensions and construction means/methods.', '【正解：A】審批製造圖（Shop Drawings）旨在核對是否符合整體設計概念，承建商依然要對詳細製造尺寸及施工安全負責。'],
      ['III', 'In project scheduling, what defines the "Critical Path"?', 'A. The sequence of activities with the highest financial cost', 'B. The longest chain of dependent activities determining the minimum project duration (zero float)', 'C. The list of tasks assigned to external subcontractors', 'D. The shortest route through the network diagram', 1, 'The Critical Path is the longest sequence of dependent tasks with zero float; any delay on the critical path delays total project completion.', '【正解：B】關鍵路徑（Critical Path）係工期最長、浮時為零（Zero Float）嘅相依任務鏈，一旦延誤即推遲整個項目完工期。'],
      ['III', 'What security requirement applies when a P.Eng. uses a digital or electronic seal on engineering documents?', 'A. The digital signature must be under the engineer’s sole control and detect any post-signing alteration', 'B. The password must be shared with administrative staff for office efficiency', 'C. An unencrypted bitmap image of the stamp is sufficient for all regulatory submissions', 'D. Electronic seals are prohibited on structural drawings in Canada', 0, 'Digital seals must remain under the engineer’s sole control and use cryptographic verification that invalidates the signature if the file is modified.', '【正解：A】電子簽章必須由工程師本人獨家控制，並具備防篡改技術（一旦文件簽署後被修改即顯示失效）。'],
      ['III', 'Under Bill C-45 (the Westray Bill amendment to the Criminal Code), when can an organization or manager be convicted of criminal negligence?', 'A. When directing work with wanton or reckless disregard for worker life and safety', 'B. Whenever a project exceeds its approved municipal budget', 'C. Whenever a minor workplace injury occurs despite full safety compliance', 'D. When failing to renew a provincial Certificate of Authorization on time', 0, 'Criminal Code s. 217.1 imposes a legal duty on anyone directing work to take reasonable steps to prevent bodily harm; reckless disregard constitutes criminal negligence.', '【正解：A】源於 Westray 礦難嘅刑法修訂（Bill C-45）：指導工作嘅管理層若罔顧工人生命安全、未採取合理安全措施導致傷亡，可被控刑事疏忽罪。'],

      ['IV', 'Which of the following is NOT one of the five essential elements required to form a legally binding contract?', 'A. Mutual intent (Offer and Acceptance)', 'B. Consideration', 'C. Independent witness notarization', 'D. Capacity and legality of purpose', 2, 'The 5 elements of a contract are Offer & Acceptance, Consideration, Capacity, Legality, and Intent to create legal relations. Witness notarization is not required.', '【正解：C】有效合約五大要素：Offer & Acceptance、Consideration、Capacity、Legality、Intent。普通商業合約並無規定必須有公證人見證（Notarization）。'],
      ['IV', 'Party A offers to sell equipment for $100,000. Party B replies, "I accept if you lower the price to $90,000." Party A refuses. Can Party B now accept the original $100,000 offer?', 'A. Yes, if the original offer deadline has not expired', 'B. No, because Party B’s counter-offer terminated the original offer', 'C. Yes, under the doctrine of equitable estoppel', 'D. Yes, under the postal acceptance rule', 1, 'A counter-offer acts as a rejection in law and permanently extinguishes the original offer.', '【正解：B】還價即殺死原要約（A counter-offer kills the original offer）！當 B 還價 9 萬被拒後，原本 10 萬嘅 Offer 已經永久失效。'],
      ['IV', 'Under the Ron Engineering tendering framework, when is "Contract A" legally formed?', 'A. When the owner publishes the invitation to tender in a newspaper', 'B. When a bidder submits a compliant bid in response to the call for tenders', 'C. When the winning contractor signs the final construction agreement', 'D. When the engineer issues the certificate of substantial performance', 1, 'In Ron Engineering, the call for tenders is the offer to form Contract A, and submitting a compliant bid is the acceptance that forms Contract A.', '【正解：B】喺 Ron Engineering 雙合約制下，一遞交合規標書（Compliant bid）即刻成立 Contract A（投標過程合約）。'],
      ['IV', 'A bidder submits a tender with a hidden internal spreadsheet calculation omission not visible on the face of the bid. How is this classified?', 'A. A non-patent error that binds the bidder under Contract A', 'B. A patent error that allows the bidder to withdraw without penalty', 'C. Frustration of contract discharging both parties', 'D. Mutual mistake voiding the tender call', 0, 'An internal calculation mistake not obvious on the face of the tender is a non-patent (latent) error; Contract A binds the bidder and the bid deposit is forfeited upon refusal to sign Contract B.', '【正解：A】內部計錯數而標書表面睇唔出，屬於 Non-patent error（非表面明顯錯誤），Contract A 完全有效，悔標會被沒收 Bid Bond。'],
      ['IV', 'Conversely, if a bid contains a glaring math error immediately obvious on the face of the tender document when opened, how is it treated?', 'A. It is a patent error, and the owner cannot snap up the mistaken bid', 'B. The bidder must perform the work at the mistaken lower price', 'C. The owner may double the bid bond forfeiture', 'D. The error automatically awards the contract to the engineer', 0, 'An error obvious on the face of the tender is a Patent Error; under Canadian common law, an offeree cannot "snap up" an offer knowing it contains a patent mistake.', '【正解：A】標書表面一眼就睇得出嘅明顯錯誤叫 Patent Error（表面明顯錯誤），業主唔可以趁火打劫強迫對方中標。'],
      ['IV', 'According to M.J.B. Enterprises Ltd. v. Defence Construction, what is the legal limit of a "Privilege Clause" ("lowest or any tender not necessarily accepted")?', 'A. It allows the owner to accept a non-compliant bid if it saves money', 'B. It does not permit the owner to accept a non-compliant bid', 'C. It eliminates the formation of Contract A entirely', 'D. It allows the owner to engage in post-closing bid shopping', 1, 'In M.J.B. Enterprises, the Supreme Court ruled that a privilege clause allows nuanced evaluation criteria, but NEVER permits accepting a non-compliant bid.', '【正解：B】必考案例 M.J.B. Enterprises：特權條款（Privilege Clause）只容許業主唔揀最低價，但絕對唔容許業主接受一份不合規標書（Non-compliant bid）！'],
      ['IV', 'What unethical and unlawful tendering practice occurs when an owner uses the lowest submitted bid price to pressure other bidders into lowering their prices after tender closing?', 'A. Value engineering', 'B. Bid shopping', 'C. Quantum meruit', 'D. Subrogation', 1, 'Bid shopping breaches the implied duty of fairness and good faith owed to all compliant bidders under Contract A.', '【正解：B】開標後攞住最低標價去壓其他判頭減價叫做 Bid Shopping（壓價競價），違反 Contract A 公平義務。'],
      ['IV', 'A client verbally promises not to enforce a strict contract deadline, and the engineer relies on this promise to their detriment. Which doctrine prevents the client from later enforcing the penalty?', 'A. Parol evidence rule', 'B. Equitable (promissory) estoppel', 'C. Contra proferentem', 'D. Vicarious liability', 1, 'Equitable estoppel (Conwest Exploration v. Letkeman) bars a party from strictly enforcing contractual rights after making a clear assurance that was detrimentally relied upon.', '【正解：B】Equitable Estoppel（衡平法不容反悔）：口頭承諾放寬限期而對方信以為真並依賴行事，承諾方事後不得反口嚴格執行原條款。'],
      ['IV', 'When an engineer performs urgent design services at a client’s request before any fee is agreed upon, how do courts determine payment?', 'A. Quantum meruit (a reasonable market sum for services rendered)', 'B. Liquidated damages', 'C. Specific performance', 'D. Nominal damages of $1', 0, 'Quantum meruit ("as much as is deserved") awards fair market compensation to prevent unjust enrichment when no price was fixed.', '【正解：A】Quantum Meruit（按勞計酬）：當應客戶要求開工但未傾好價錢，法庭會判客戶按合理市場價值付款。'],
      ['IV', 'What must a plaintiff prove to succeed in a civil Tort of Negligence claim against an engineer?', 'A. Privity of contract, consideration, and malice', 'B. Duty of care, breach of standard of care, causation, and actual damages', 'C. Violation of the Criminal Code beyond a reasonable doubt', 'D. Intentional fraud and breach of fiduciary duty', 1, 'Tort negligence requires proving: 1) Duty of care, 2) Breach of reasonable standard of care, 3) Causation (and non-remoteness), and 4) Actual damages/loss.', '【正解：B】疏忽侵權（Tort of Negligence）四大成立要件：謹慎責任（Duty of Care）、違反標準（Breach of Standard）、因果關係（Causation）及實際損失（Actual Damages）。'],
      ['IV', 'Under the Winnipeg Condominium precedent, when can a subsequent building purchaser sue the original engineer in tort for repair costs?', 'A. Whenever cosmetic paint or flooring finishes deteriorate prematurely', 'B. When structural defects pose a real and substantial danger to occupant safety', 'C. Only if the original owner assigned the written contract to the buyer', 'D. Only after a physical collapse injures a pedestrian', 1, 'Winnipeg Condominium allows recovery of pure economic loss in tort for the cost of repairing defects that pose a real and substantial danger to health and safety.', '【正解：B】Winnipeg Condominium 案：當結構缺陷構成「真實且重大嘅生命安全危險 (Real and substantial danger)」，二手業主無合約亦可喺意外發生前用 Tort 追討維修費。'],
      ['IV', 'Which legal doctrine makes an engineering firm financially liable for negligent design errors committed by its salaried employees within the scope of employment?', 'A. Vicarious liability', 'B. Strict liability', 'C. Subrogation', 'D. Caveat emptor', 0, 'Vicarious liability ("respondeat superior") holds employers financially responsible for torts committed by employees in the ordinary course of employment.', '【正解：A】Vicarious Liability（轉承責任）：僱主須為受僱員工喺正常職務範圍內犯下嘅疏忽承擔民事賠償責任。'],
      ['IV', 'In Edgeworth Construction v. N.D. Lea, how did the Supreme Court rule regarding the personal tort liability of the individual salaried engineers who sealed the highway tender drawings?', 'A. The consulting firm was liable, but the individual salaried engineers who sealed the drawings were not personally liable', 'B. Only the individual engineers were personally liable up to their personal assets', 'C. Sealing a drawing automatically creates personal financial guarantee to contractors', 'D. Both the firm and employees were immune due to crown immunity', 0, 'In Edgeworth Construction, the SCC held the engineering firm liable for negligent misrepresentation, but ruled that an employee’s seal alone does not make the individual employee personally liable in tort to contractors.', '【正解：A】Edgeworth Construction 案：工程顧問公司須就招標圖紙失實陳述賠償，但受僱蓋印嘅個別工程師員工毋須承擔個人民事賠償。'],
      ['IV', 'How did an explicit disclaimer on a preliminary soil report affect third-party contractor liability in negligent misrepresentation (Hedley Byrne principle)?', 'A. A clear disclaimer negates reasonable reliance, shielding the engineer from third-party tort liability', 'B. Disclaimers are legally void in all Canadian engineering reports', 'C. Disclaimers double the statutory limitation period', 'D. Disclaimers transfer liability to the provincial regulator', 0, 'Under Hedley Byrne v. Heller (and Wolverine Tube), a clear disclaimer stating a report is not to be relied upon by third-party bidders negates reasonable reliance.', '【正解：A】喺 Hedley Byrne 疏忽失實陳述原則下，報告封面清晰嘅第三方免責聲明（Disclaimer）能阻斷「合理依賴 (Reasonable reliance)」，保護工程師免受第三方索償。'],
      ['IV', 'What are the Basic and Ultimate Limitation Periods under Ontario’s Limitations Act?', 'A. 1 year from discovery; 5 years from the act', 'B. 2 years from discovery; 15 years from the date the act or omission occurred', 'C. 5 years from discovery; 25 years from substantial performance', 'D. 6 years from discovery; no ultimate cap for engineering defects', 1, 'Ontario’s Limitations Act sets a 2-year Basic Limitation Period from discovery and a 15-year Ultimate Limitation Period from the date of the act/omission.', '【正解：B】安省訴訟時效：基本時效為發現日起計 2 年（Basic）；最終時效為行為發生日起計 15 年（Ultimate）。'],
      ['IV', 'What is the mandatory statutory holdback percentage an owner must retain from progress payments under Ontario’s Construction Act?', 'A. 5%', 'B. 10%', 'C. 15%', 'D. 20%', 1, 'Ontario’s Construction Act requires payers to retain a 10% statutory holdback to protect against construction liens.', '【正解：B】安省《Construction Act》規定業主每次出糧畀大判時必須扣起 10% 法定扣留金（Statutory Holdback）。'],
      ['IV', 'What is the legal effect of a contract clause requiring a subcontractor to waive their statutory construction lien rights in advance?', 'A. It is completely void and unenforceable by statute', 'B. It is valid if initialed by a licensed engineer', 'C. It reduces the statutory holdback to 2%', 'D. It converts the subcontract into a general partnership', 0, 'Construction lien legislation explicitly renders any agreement to waive statutory lien rights null and void.', '【正解：A】法例明文規定，任何要求分判商預先放棄法定工程留置權（Construction Lien）嘅合約條款一律自動無效（Void）！'],
      ['IV', 'Which rule of contract interpretation states that an ambiguous clause in a standard-form contract is interpreted strictly against the party who drafted it?', 'A. Contra proferentem', 'B. Res ipsa loquitur', 'C. Quantum meruit', 'D. Force majeure', 0, 'Contra proferentem construes contractual ambiguity against the drafter.', '【正解：A】Contra Proferentem（對起草方不利原則）：條文含糊時，法庭會作出對起草該條文一方最不利嘅解釋。'],
      ['IV', 'How do Canadian courts distinguish an enforceable "Liquidated Damages" clause from an unenforceable "Penalty Clause"?', 'A. Liquidated damages must be a genuine pre-estimate of foreseeable loss at the time of contracting', 'B. Penalty clauses are enforceable if written in bold capital letters', 'C. Liquidated damages can only be claimed in criminal court', 'D. Penalty clauses are valid whenever a project is delayed by more than 7 days', 0, 'A genuine pre-estimate of loss is enforceable as Liquidated Damages; an extravagant sum intended to punish or terrorize is struck down as an unenforceable Penalty.', '【正解：A】有效嘅預定違約金（Liquidated Damages）必須係簽約時對可預見損失嘅真實合理估算；若金額誇張純為懲罰對方，則屬無效嘅 Penalty Clause。'],
      ['IV', 'What is the three-part test established by the Supreme Court of Canada in Tercon Contractors for enforcing an exclusion of liability clause?', 'A. Interpretation/applicability, unconscionability at contract formation, and overriding public policy', 'B. Offer, acceptance, and past consideration', 'C. Foreseeability, proximity, and strict liability', 'D. Mediation, arbitration, and litigation', 0, 'Tercon replaced the old "fundamental breach" rule with a 3-step test: 1) Does the clause apply? 2) Was it unconscionable when made? 3) Does overriding public policy bar enforcement?', '【正解：A】最高法院 Tercon 案審視免責條款三部曲：1) 條文字眼是否適用；2) 簽約時有否不公平壓迫（Unconscionability）；3) 有否違反重大公共政策。'],
      ['IV', 'How does a construction Surety Bond (such as a Performance Bond) fundamentally differ from an insurance policy?', 'A. The surety has the legal right of indemnity to recover all payouts from the defaulting contractor', 'B. The surety absorbs the loss permanently without recourse against the contractor', 'C. A performance bond is a two-party contract between the engineer and regulator', 'D. Surety bonds cover professional design errors made by the owner', 0, 'Unlike insurance, suretyship is a three-party credit guarantee: if the surety pays to finish the project, it recovers the full amount from the defaulting principal under the indemnity agreement.', '【正解：A】Surety Bond（工程擔保）唔係保險！擔保公司代大判賠錢執手尾後，有權根據彌償協議（Indemnity Agreement）向違約大判及其擔保人追討全數款項。'],
      ['IV', 'Why do retiring consulting engineers need "Run-Off Coverage" for their Professional Liability (E&O) Insurance?', 'A. Because E&O policies are written on a "Claims-Made" basis rather than an "Occurrence" basis', 'B. Because provincial regulators charge a retirement tax without insurance', 'C. Because copyright expires upon retirement', 'D. Because construction liens can be filed 30 years after completion', 0, 'Professional liability insurance is "Claims-Made": the policy active when the lawsuit is filed responds, not the policy that was active years earlier when the design was done.', '【正解：A】專業責任保險（E&O）採「索償提出制 (Claims-Made)」，以被人告當日有冇有效保單為準，所以退休後仍需買 Run-off 保險防範過往項目被追討。'],
      ['IV', 'In Alternative Dispute Resolution (ADR), what is the key difference between Mediation and Binding Arbitration?', 'A. A mediator facilitates voluntary settlement; an arbitrator issues a legally binding decision', 'B. Mediation rulings are enforced by court bailiffs; arbitration is non-binding advice', 'C. Mediation is conducted by a public judge; arbitration is conducted by a jury', 'D. Arbitration is prohibited in Canadian construction contracts', 0, 'Mediators have no power to impose a decision; Arbitrators act as private judges and issue binding awards.', '【正解：A】調解員（Mediator）只協助雙方自願談判和解，無判決權；仲裁員（Arbitrator）則作出具法律約束力嘅裁決。'],

      ['V', 'How long does Patent protection last in Canada, and when does the term begin?', 'A. 20 years from the filing date, non-renewable', 'B. 20 years from the date the patent is granted, renewable once', 'C. 10 years from first commercial sale, renewable indefinitely', 'D. 50 years after the death of the inventor', 0, 'Canadian patents last for 20 years measured from the application filing date and cannot be renewed.', '【正解：A】加拿大專利（Patent）保護期由「申請日 (Filing date)」起計 20 年，不可續期。'],
      ['V', 'What three fundamental criteria must an invention satisfy to be patentable in Canada?', 'A. Novel, useful, and non-obvious', 'B. Artistic, original, and dramatic', 'C. Confidential, trademarked, and commercially profitable', 'D. Aesthetic, ornamental, and mass-produced', 0, 'An invention must be New (novel), Useful (utility), and Non-obvious (inventive ingenuity).', '【正解：A】專利三大條件：新穎（Novel）、實用（Useful）、非顯而易見（Non-obvious）。'],
      ['V', 'An inventor publishes her research in an engineering journal and files a Canadian patent application 8 months later. How does Canadian patent law treat this?', 'A. Valid, because Canada provides a 1-year grace period for the inventor’s own public disclosure', 'B. Invalid, because any prior public disclosure immediately destroys novelty in Canada', 'C. Valid only if the journal article was written in French', 'D. Automatically converted into an industrial design registration', 0, 'Canada’s Patent Act provides a 12-month (1-year) grace period before filing for public disclosures made by the inventor.', '【正解：A】加拿大專利法設有 1 年公開寬限期（1-Year Grace Period），發明者自己公開發表後 12 個月內喺加拿大申請專利仍有效。'],
      ['V', 'An independent consulting engineer is hired by a client to write custom software. The contract is silent on intellectual property. Who owns the Copyright?', 'A. The independent consulting engineer retains copyright; the client gets an implied license to use it', 'B. The client automatically owns the copyright upon paying the invoice', 'C. Ownership is split 50/50 as joint authors', 'D. The provincial engineering regulator holds the copyright', 0, 'Unlike salaried employees, an independent contractor retains copyright ownership unless there is a written assignment to the client.', '【正解：A】極常考陷阱：若係外判獨立顧問（Independent Consultant）且合約無明文轉讓版權，版權歸顧問自己擁有，客戶只獲隱含使用許可（Implied license）！'],
      ['V', 'What are "Moral Rights" under the Canadian Copyright Act?', 'A. An author’s right to attribution and to prevent derogatory distortion, which can be waived but never assigned', 'B. The right to collect royalties for 100 years after publication', 'C. The right of an employer to patent an employee’s software', 'D. The statutory duty to report copyright piracy to police', 0, 'Moral rights protect the creator’s honor, reputation, and attribution; even when economic copyright is sold, moral rights cannot be assigned (only waived in writing).', '【正解：A】Moral Rights（精神權利）保護作者署名權及防止作品被惡意歪曲損害聲譽；Moral Rights 不可轉讓（Cannot be assigned），只可書面放棄（Waived）。'],
      ['V', 'How long does a registered Trademark last in Canada?', 'A. 10 years, renewable indefinitely every 10 years', 'B. 15 years total with no renewal', 'C. 20 years from the filing date', 'D. Life of the founder plus 70 years', 0, 'Canadian trademark registration lasts 10 years and can be renewed indefinitely in 10-year increments.', '【正解：A】加拿大註冊商標（Trademark）每期 10 年，只要持續使用並繳費即可無限次續期。'],
      ['V', 'Which form of intellectual property protects the purely visual, ornamental shape or pattern of a manufactured article?', 'A. Industrial Design', 'B. Utility Patent', 'C. Trade Secret', 'D. Integrated Circuit Topography', 0, 'Industrial Design protects the visual aesthetic shape, configuration, or ornamentation of a manufactured product for up to 15 years.', '【正解：A】Industrial Design（工業設計，最長 15 年）專門保護量產產品嘅視覺外觀形狀，而非內部機械功能。'],
      ['V', 'What does the federal Integrated Circuit Topography Act protect?', 'A. Three-dimensional microchip circuit layout configurations', 'B. Geological surveying and mountain contour maps', 'C. High-voltage power transmission grid routes', 'D. Municipal zoning and land-use boundaries', 0, 'Despite the word "topography", the Act protects the 3D configuration of electronic circuits in semiconductor microchips for up to 10 years.', '【正解：A】字面陷阱：Integrated Circuit Topography Act 保護嘅係「半導體晶片（Microchip）三維電路佈局設計」，唔係地形山脈地圖！'],
      ['V', 'What is the primary liability risk for engineers operating together as a traditional General Partnership?', 'A. Unlimited, joint and several personal liability for partnership debts and partner negligence', 'B. Double corporate taxation on retained earnings', 'C. Inability to obtain a Certificate of Authorization', 'D. Mandatory public disclosure of partner tax returns', 0, 'In a General Partnership, every partner has unlimited personal liability (joint and several) for the wrongful acts and business debts of all other partners.', '【正解：A】一般合夥（General Partnership）最大風險係全體合夥人須承擔「無限連帶個人責任 (Unlimited joint and several personal liability)」，一人闖禍全體身家連坐。'],
      ['V', 'How does a Limited Liability Partnership (LLP) protect professional partners compared to a General Partnership?', 'A. It shields innocent partners from personal liability for the negligence of another partner they did not supervise', 'B. It grants complete immunity from the partner’s own personal negligence', 'C. It eliminates the requirement to carry professional liability insurance', 'D. It converts the partnership into a crown corporation', 0, 'An LLP protects innocent partners’ personal assets from malpractice claims caused solely by another partner whom they did not supervise.', '【正解：A】有限責任合夥（LLP）保護無辜合夥人唔使為「其他合夥人犯下嘅專業疏忽」賠上個人私產（但自己犯嘅疏忽仍須個人負責）。'],
      ['V', 'Although corporate shareholders enjoy limited liability, for what obligations can Corporate Directors be held personally liable by statute?', 'A. Unpaid employee wages (up to 6 months), unremitted payroll taxes, and environmental or OH&S breaches', 'B. All ordinary commercial trade debts when a client defaults', 'C. Fluctuations in the corporation’s share price', 'D. Patent infringement committed by an unrelated supplier', 0, 'Directors face statutory personal liability for unpaid wages, unremitted source deductions/HST, and environmental/OHSA compliance failures.', '【正解：A】有限公司董事（Directors）喺法例下仍須對拖欠員工薪金（最多6個月）、預扣稅款、環境污染及職安健違規承擔個人法律責任。'],

      ['VI', 'What is required before a licensed P.Eng. in Ontario can offer professional engineering services directly to the public?', 'A. A Certificate of Authorization (C of A) and professional liability insurance', 'B. Designation as a Consulting Engineer by PEO Council', 'C. At least 10 years of post-graduation management experience', 'D. Membership in the Ontario Society of Professional Engineers (OSPE)', 0, 'Offering engineering services to the public requires holding a Certificate of Authorization (C of A) and complying with liability insurance requirements.', '【正解：A】向公眾提供工程顧問服務必須持有 Certificate of Authorization (C of A) 及專業責任保險。'],
      ['VI', 'What is the difference between the Complaints Committee and the Discipline Committee in PEO’s regulatory process?', 'A. Complaints investigates and refers matters; Discipline conducts formal hearings and imposes penalties', 'B. Complaints revokes licenses; Discipline handles academic credential assessment', 'C. Complaints arbitrates civil fee disputes; Discipline prosecutes criminal charges', 'D. Both committees have identical powers to suspend licenses', 0, 'The Complaints Committee screens and investigates complaints (and can refer them or issue a caution), whereas only the Discipline Committee holds hearings and revokes/suspends licenses.', '【正解：A】Complaints Committee 只負責調查篩選及轉介（無權釘牌）；Discipline Committee 先係正式開庭審訊並有權釘牌、停牌或罰款嘅審裁處。'],
      ['VI', 'What are the requirements to use the protected title "Consulting Engineer" in Ontario?', 'A. P.Eng. license, 5+ years post-P.Eng. experience, 2+ years independent practice, and PEO Council designation', 'B. Simply holding an active P.Eng. license and a business bank account', 'C. Completing a master’s degree in business administration', 'D. Registering a sole proprietorship with the provincial ministry', 0, '"Consulting Engineer" is a restricted title in Ontario requiring PEO Council designation (5+ years P.Eng., 2+ years independent practice, renewed every 5 years).', '【正解：A】安省 "Consulting Engineer" 係受保護專屬頭銜，必須獲 PEO 特別頒授（要求 P.Eng. 滿 5 年、具 2 年以上獨立執業經驗，每 5 年續期）。'],
      ['VI', 'What is a "Provisional License" under Ontario’s Professional Engineers Act?', 'A. A license for applicants who have met all requirements except the 12 months of Canadian-supervised experience', 'B. A license permitting a non-engineer technologist to seal narrow technical work', 'C. A student membership card for undergraduate engineering co-op interns', 'D. A lifetime retired membership certificate', 0, 'A Provisional License is granted to applicants who have satisfied academic, exam, and general experience requirements, lacking only the 12 months of Canadian-jurisdiction experience under a P.Eng.', '【正解：A】暫准牌照（Provisional License）發畀已符合學歷、考試及經驗要求，唯獨欠缺「12個月加拿大本地 P.Eng. 監督經驗」嘅申請人。'],
      ['VI', 'What is a "Limited License" issued by a provincial engineering regulator?', 'A. Authorization to practice professional engineering strictly within a narrowly defined technical scope', 'B. A license that allows unlimited engineering practice for a 6-month trial period', 'C. A license restricted to engineers under the age of 25', 'D. A permit allowing an engineer to waive the Code of Ethics', 0, 'A Limited License authorizes an experienced technical specialist (often a technologist or scientist) to practice engineering strictly within the specific services defined on the license.', '【正解：A】有限制牌照（Limited License）授權具備特定深厚技術經驗嘅人員，嚴格喺牌照列明嘅特定狹窄技術範圍內獨立執業。'],
      ['VI', 'What is the standard of proof applied by the Discipline Committee in a professional misconduct hearing?', 'A. Balance of probabilities supported by clear, cogent, and convincing evidence', 'B. Proof beyond a reasonable doubt (criminal standard)', 'C. Mere suspicion or prima facie allegation', 'D. Absolute mathematical certainty', 0, 'Professional discipline tribunals apply the civil standard of proof on a "balance of probabilities" (>50%) based on clear and convincing evidence.', '【正解：A】紀律聆訊屬行政/民事審裁程序，舉證標準係「可能性權衡 (Balance of probabilities，即 >50%)」並輔以清晰可信證據。'],
      ['VI', 'How does a provincial engineering regulator enforce the Act against an UNLICENSED non-member who illegally uses the title P.Eng.?', 'A. Prosecution in provincial offences court for statutory fines or court injunctions', 'B. Conducting an internal Discipline Committee hearing to revoke their license', 'C. Issuing a non-disciplinary letter of advice from the Complaints Committee', 'D. Referring the matter to the Canadian Engineering Accreditation Board', 0, 'The Discipline Committee only has jurisdiction over licensed members/holders; unlicensed offenders are prosecuted in provincial court.', '【正解：A】內部紀律委員會只管轄持牌會員；針對無牌街外人（Non-member）非法自稱 P.Eng. 或無牌執業，PEO 會直接入稟省級法院（Provincial Court）檢控！'],
      ['VI', 'In regulatory law, how does "Incompetence" differ from "Professional Misconduct"?', 'A. Incompetence is a persistent lack of knowledge, skill, or judgment; Misconduct is breaching rules or ethical standards', 'B. Incompetence applies only to financial fraud; Misconduct applies only to interns', 'C. Misconduct cannot result in license suspension', 'D. There is no statutory difference between the two terms', 0, 'Professional Misconduct involves violating the Act, regulations, or Code of Ethics; Incompetence refers to a serious lack of technical knowledge, skill, or capacity making the member unfit to practice.', '【正解：A】Professional Misconduct 指違反法規或操守（如借印、收賄）；Incompetence 指缺乏基本工程知識、技能或判斷力而不適合執業。'],
      ['VI', 'What must a corporation holding a Certificate of Authorization (C of A) do if its sole designated supervising P.Eng. resigns?', 'A. Notify the regulator immediately and appoint a replacement P.Eng. or cease offering engineering services', 'B. Continue using the departed engineer’s seal until the C of A renewal date', 'C. Delegate sealing authority to the corporate chief financial officer', 'D. Transfer the C of A to a subcontractor', 0, 'A C of A holder must always have at least one licensed P.Eng. taking professional responsibility; if that engineer leaves, the regulator must be notified immediately.', '【正解：A】C of A 機構一旦失去唯一負責監督嘅 P.Eng.，必須立即通知監管機構並委任替補 P.Eng.，否則不得繼續向公眾提供工程服務。'],
      ['VI', 'To which body may an Ontario P.Eng. appeal a final decision and penalty imposed by the PEO Discipline Committee?', 'A. The Divisional Court of the Ontario Superior Court of Justice', 'B. The Complaints Committee', 'C. Engineers Canada National Board', 'D. The Ministry of Labour', 0, 'Statutory appeals from the Discipline Committee in Ontario lie to the Divisional Court of the Superior Court of Justice.', '【正解：A】若不服 Discipline Committee 嘅裁決，有法定權利向安省高等法院分庭（Divisional Court）提出上訴。']

    function buildInitial110QuestionPool() {
      const pool = [...CRISP_TRICKY_SEED_QUESTIONS];

      // Add the 58 distinct crisp blueprints first
      CRISP_107_BLUEPRINTS.forEach((bp, idx) => {
        const [topicId, question, optA, optB, optC, optD, correctIndex, enExp, zhExp] = bp;
        pool.push(
          normalizeAndBalanceQuestionOptions({
            id: `q-crisp-${idx + 4}`,
            topicId,
            difficulty: 'Crisp & Tricky Concept (精煉概念與次序陷阱)',
            question,
            options: [optA, optB, optC, optD],
            correctIndex,
            enExplanation: enExp,
            zhExplanation: zhExp,
            trapAnalysis: `精煉概念陷阱：四個選項均為簡潔自然短句，請重點分辨正確選項 (${['A', 'B', 'C', 'D'][correctIndex]}) 與另外三個「似是而非」干擾項嘅微細法律/倫理分別。`
          })
        );
      });

      // Add 49 more distinct applied crisp questions so the initial bank has a full 110 unique questions
      const EXTRA_49_CRISP = [
        ['I', 'What is the primary purpose of the statutory "Right to Title" provision in engineering legislation?', 'A. Preventing unqualified individuals from misleading the public into believing they are licensed engineers', 'B. Guaranteeing minimum consulting fee rates for licensed engineers', 'C. Protecting university professors from academic plagiarism', 'D. Allowing engineers to practice architecture without restriction', 0, 'Title protection prevents the public from being misled by unlicensed individuals claiming to be Professional Engineers.', '【正解：A】頭銜保護（Right to Title）旨在防止無牌人士誤導公眾以為佢哋具備註冊專業工程師資格。'],
        ['I', 'When a retired engineer surrenders their active license and adopts a "Retired" status, what restriction applies?', 'A. They must not engage in the practice of professional engineering or seal documents', 'B. They may continue sealing residential drawings for family members', 'C. They may operate a Certificate of Authorization firm solo', 'D. They must retake the NPPE every three years', 0, 'Retired status prohibits practicing professional engineering or sealing engineering documents.', '【正解：A】轉為退休狀態（Retired）或交還牌照後，嚴禁再進行專業工程執業或蓋印。'],
        ['I', 'Which organization is responsible for negotiating employment benefits and lobbying government on behalf of engineers’ economic interests in Ontario?', 'A. Ontario Society of Professional Engineers (OSPE)', 'B. Professional Engineers Ontario (PEO)', 'C. Canadian Engineering Accreditation Board (CEAB)', 'D. Discipline Committee', 0, 'OSPE is the advocacy body serving engineers’ interests, whereas PEO is the statutory regulator protecting the public.', '【正解：A】OSPE 負責為工程師爭取經濟與政策權益（Advocacy）；PEO 則係保護公眾嘅法定監管機構（Regulator）。'],
        ['I', 'Why does an engineering graduate with an accredited degree still need 48 months of supervised experience before licensure?', 'A. To demonstrate practical application of engineering theory, ethical judgment, and communication skills', 'B. To pay off university tuition loans before joining the association', 'C. To fulfill federal labor union seniority rules', 'D. To obtain a commercial general contractor license', 0, 'Supervised experience ensures the applicant can safely apply engineering principles and professional judgment in real-world practice.', '【正解：A】48 個月實務工作經驗旨在確保畢業生能將理論安全應用於實務，並具備專業倫理判斷與溝通能力。'],
        ['I', 'What is the legal status of national guidelines published by Engineers Canada?', 'A. Model guides that become legally binding only if adopted by a provincial regulator', 'B. Federal statutes automatically enforceable in criminal court', 'C. Mandatory collective bargaining agreements', 'D. International treaties superseding provincial acts', 0, 'Engineers Canada national guidelines are model recommendations unless formally adopted by a provincial/territorial regulator.', '【正解：A】Engineers Canada 嘅全國指引屬於參考範本，必須經由各省監管機構正式採納先至具有法定約束力。'],
        ['I', 'What is the primary ethical reason engineers are encouraged to mentor Engineering Interns (EITs)?', 'A. Passing on professional values, judgment, and technical competence to safeguard future public welfare', 'B. Reducing corporate payroll expenses by delegating sealing duties', 'C. Fulfilling a mandatory requirement to renew a P.Eng. license', 'D. Transferring legal liability for design errors to the intern', 0, 'Mentoring transfers practical wisdom and ethical standards to the next generation of practitioners.', '【正解：A】指導實習工程師（EIT）係為咗傳承專業判斷與工程倫理，但注意：呢個係專業責任與貢獻，唔係續牌嘅強制條件！'],
        ['I', 'If an engineer’s P.Eng. license is suspended for non-payment of annual fees, what is their legal status during the suspension?', 'A. They are legally prohibited from practicing engineering or using the P.Eng. title', 'B. They may continue practicing as long as they pay a late fee within one year', 'C. They may seal internal drawings but not external reports', 'D. Their Certificate of Authorization automatically becomes permanent', 0, 'An administrative suspension for non-payment suspends both the right to practice and the right to use the P.Eng. title.', '【正解：A】即使係因欠交年費而被行政停牌（Suspended），停牌期間依然嚴禁執業及使用 P.Eng. 頭銜。'],
        ['I', 'What defines a "Profession" in sociological and legal terms?', 'A. Specialized advanced knowledge, self-regulation, a code of ethics, and service to the public interest', 'B. Any occupation that requires a municipal business permit', 'C. Any trade union that negotiates hourly overtime wages', 'D. Any commercial enterprise incorporated under federal law', 0, 'A profession is defined by specialized knowledge/skill, ethical governance, self-regulation, and a primary duty to serve the public.', '【正解：A】專業（Profession）嘅四大特徵：專門高深知識、專業自治、倫理守則、以及服務公眾利益。'],

        ['II', 'An engineer is offered a 5% referral commission by a software vendor if she recommends the vendor’s system to her client. What must she do?', 'A. Refuse the secret commission, or fully disclose it in writing to the client and obtain consent', 'B. Accept the commission quietly if the software is genuinely the best technical choice', 'C. Donate half of the commission to a university scholarship fund', 'D. Have the vendor pay the commission after the project closes', 0, 'Accepting secret commissions or kickbacks is a severe breach of fiduciary duty and ethics; any benefit requires full written disclosure and client consent.', '【正解：A】嚴禁收受秘密回佣（Kickbacks）；即使產品本身好，未經客戶書面知情同意收受回佣即屬違規。'],
        ['II', 'When an engineer is asked to serve as an expert witness in court, to whom does the engineer owe their primary duty?', 'A. To the court, to provide objective, impartial, and unbiased technical testimony', 'B. To the lawyer who hired them, to help win the lawsuit at all costs', 'C. To the defendant’s insurance adjuster', 'D. To their employer’s marketing department', 0, 'An expert witness owes an overriding duty to the court to provide fair, objective, non-partisan technical assistance, not to act as a hired advocate.', '【正解：A】作為法庭專家證人（Expert Witness），首要職責係向法庭提供客觀、中立、不偏不倚嘅專業意見，而唔係偏幫出錢請你嗰一方打贏官司！'],
        ['II', 'What is the ethical rule regarding engineers competing for consulting assignments?', 'A. Engineers must compete fairly on the basis of qualifications and competence without maliciously disparaging peers', 'B. Engineers may offer free design services to undercut competitors on public tenders', 'C. Engineers may copy a competitor’s proprietary proposal methodology', 'D. Engineers must charge identical fees fixed by the provincial regulator', 0, 'Competition must be fair, dignified, and merit-based without maliciously injuring the reputation or business of fellow practitioners.', '【正解：A】工程師競爭業務時應憑專業資格與實力公平競爭，不得惡意詆毀同行。'],
        ['II', 'A municipality hires an engineer to inspect a contractor’s work. The contractor offers to fly the engineer to a resort for the weekend. What should the engineer do?', 'A. Decline the trip immediately to avoid actual and perceived conflict of interest', 'B. Accept the trip if the inspection has already been passed', 'C. Accept the trip but pay for meals out of pocket', 'D. Ask the contractor to book the flight under a spouse’s name', 0, 'Accepting lavish hospitality or travel from a contractor whose work you are inspecting compromises impartiality and creates a clear conflict of interest.', '【正解：A】負責監督驗收承建商工程時，絕不能接受承建商提供嘅旅遊或貴重款待，必須立即拒絕以防利益衝突。'],
        ['II', 'An engineer signs a Non-Disclosure Agreement (NDA) with a client, then discovers the client’s process is releasing lethal gas toward a school. What takes precedence?', 'A. The paramount ethical and statutory duty to protect public life and safety overrides the private NDA', 'B. The NDA strictly bars disclosure under contract law', 'C. The engineer must wait for the NDA to expire before warning authorities', 'D. The engineer should ask the client for a higher fee to cover the risk', 0, 'A private confidentiality agreement can never lawfully prevent an engineer from reporting an imminent threat to human life or public safety.', '【正解：A】私人保密協議（NDA）絕對不能凌駕於保障公眾生命安全嘅最高倫理與法定通報責任之上。'],
        ['II', 'What is "Ethical Relativism"?', 'A. The belief that moral principles are not universal but depend on cultural or societal context', 'B. The duty to follow universal moral laws regardless of consequences', 'C. The calculation of maximum happiness for the majority', 'D. The legal doctrine of family conflict of interest', 0, 'Ethical relativism holds that morality is relative to the norms of one’s culture rather than absolute universal rules.', '【正解：A】Ethical Relativism（倫理相對主義）認為道德並無普世絕對標準，而係隨不同文化或社會背景而異。'],
        ['II', 'What is "Ethical Egoism"?', 'A. The normative position that moral agents ought to act in their own self-interest', 'B. Placing the welfare of the public above personal gain', 'C. Adhering to Kant’s categorical imperative', 'D. Sharing intellectual property freely with the public', 0, 'Ethical egoism argues that individuals should act to maximize their own self-interest (which conflicts with professional engineering ethics).', '【正解：A】Ethical Egoism（倫理利己主義）主張凡事以個人自身最大利益為依歸（與工程師公眾利益至上原則相悖）。'],
        ['II', 'If an engineer’s technical recommendation is overruled by non-engineering management on a safety-critical matter, what must the engineer do first?', 'A. Clearly explain the safety consequences in writing and escalate through internal management', 'B. Sabotage the manufacturing equipment to prevent operation', 'C. Post confidential company blueprints on social media', 'D. Erase their name from the employment roster', 0, 'The engineer must formally advise the employer in writing of the specific consequences and escalate internally before external reporting.', '【正解：A】當關乎安全嘅專業意見被管理層推翻，工程師必須先以書面清楚指出潛在後果並向高層升級反映。'],

        ['III', 'What is the primary purpose of a Quality Management System (QMS) in an engineering firm?', 'A. Establishing consistent, documented processes for design review, verification, and continuous improvement', 'B. Eliminating the need for licensed engineers to seal drawings', 'C. Guaranteeing a minimum 25% profit margin on consulting contracts', 'D. Replacing statutory building code inspections', 0, 'A QMS ensures systematic design control, independent verification, document control, and continual improvement.', '【正解：A】品質管理系統（QMS）旨在建立一致嘅設計審核、獨立驗證、文件控制與持續改善流程。'],
        ['III', 'In risk management, how is Quantitative Risk Exposure defined?', 'A. Probability of occurrence multiplied by the severity of consequences', 'B. Total project budget divided by the number of engineers', 'C. Insurance deductible minus the statutory holdback', 'D. Duration of the critical path plus float time', 0, 'Risk = Probability (Likelihood) × Consequence (Impact/Severity).', '【正解：A】風險計算公式：Risk = Probability（發生機率）× Consequence（後果嚴重程度）。'],
        ['III', 'Once a risk is identified and quantified, what are the four classic risk response strategies?', 'A. Avoid, Mitigate (Reduce), Transfer (Insure), or Accept (Retain)', 'B. Conceal, Deny, Litigate, or Resign', 'C. Patent, Copyright, Trademark, or Seal', 'D. Offer, Acceptance, Consideration, or Capacity', 0, 'The four standard risk management strategies are Avoidance, Mitigation/Reduction, Transfer (e.g., insurance/contract), and Acceptance/Retention.', '【正解：A】四大標準風險應對策略：規避（Avoid）、減輕（Mitigate）、轉移（Transfer，如買保險）、承擔（Accept）。'],
        ['III', 'How should modern engineers account for climate change when designing long-lifespan municipal infrastructure?', 'A. Incorporate forward-looking climate projections and resilience rather than relying solely on historical weather data', 'B. Use only rainfall records from the 1950s to minimize construction cost', 'C. Disclaim all responsibility for extreme weather events on the seal', 'D. Design infrastructure for a 2-year lifespan only', 0, 'Engineers Canada guidelines require integrating climate change adaptation and future hydrological projections into infrastructure design.', '【正解：A】設計長壽命基建時，必須納入前瞻性氣候變化預測與抗災韌性（Resilience），不能單靠舊有歷史靜態天氣數據。'],
        ['III', 'Under Canadian OH&S law, what is the "Internal Responsibility System" (IRS)?', 'A. The principle that employers, supervisors, and workers all share direct responsibility for workplace safety', 'B. A tax auditing system managed by the corporate accounting department', 'C. A policy allowing companies to self-insure without government inspection', 'D. A mechanism for transferring all safety fines to junior workers', 0, 'IRS means workplace health and safety is a shared duty across everyone in the workplace, proportional to their authority and control.', '【正解：A】內部責任制（IRS）指僱主、主管及工人各方均須按其職權共同承擔維持工作場所安全嘅責任。'],
        ['III', 'When a worker exercises their statutory Right to Refuse Unsafe Work under OHSA, what is the employer prohibited from doing?', 'A. Threatening, dismissing, disciplining, or penalizing the worker (No Reprisal)', 'B. Investigating the hazard in the presence of a safety representative', 'C. Assigning the worker temporary alternative safe duties at regular pay', 'D. Repairing the defective machine guard', 0, 'OHSA strictly prohibits any employer reprisal (dismissal, penalty, intimidation) against a worker who lawfully exercises safety rights.', '【正解：A】法例嚴禁僱主對行使「拒絕危險工作權」嘅員工進行解僱、扣薪或任何報復（No Reprisal）。'],
        ['III', 'Why should an engineering firm retain project calculations and records for at least 15 years after completion in Ontario?', 'A. To defend against latent defect claims up to the expiry of the 15-year Ultimate Limitation Period', 'B. Because copyright expires after 15 years', 'C. To satisfy the 15-year statutory construction lien holdback period', 'D. Because PEO re-grades calculations every 15 years', 0, 'Retaining records through the 15-year ultimate limitation period ensures the firm has evidence to prove it met the standard of care if sued.', '【正解：A】保留工程計算與檔案至少 15 年，係為咗配合安省 15 年最終訴訟時效（Ultimate Limitation Period），以便萬一被索償時有證據自辯。'],
        ['III', 'What is the purpose of Workplace Hazardous Materials Information System (WHMIS) in Canada?', 'A. Providing standardized hazard labels, safety data sheets (SDS), and worker education on hazardous products', 'B. Regulating structural steel import tariffs', 'C. Licensing environmental consulting firms', 'D. Auditing corporate greenhouse gas emissions', 0, 'WHMIS supports workers’ Right to Know through hazard labels, Safety Data Sheets (SDS), and worker training.', '【正解：A】WHMIS 透過標準化危險標籤、安全資料表（SDS）及員工培訓，落實工人對危險化學品嘅「知情權 (Right to Know)」。'],

        ['IV', 'Under the traditional common law "Postal Acceptance Rule," when does an acceptance sent by regular mail take legal effect?', 'A. When the properly addressed and stamped acceptance letter is dropped into the mailbox', 'B. Only when the offeror opens and reads the letter', 'C. Seven business days after postmarking', 'D. When confirmed by a follow-up telephone call', 0, 'Where mail is an appropriate medium, acceptance is effective upon posting/dispatch (whereas revocation of an offer requires actual receipt).', '【正解：A】郵寄承約法則（Postal Acceptance Rule）：承約信一投入郵筒即刻生效；但撤回要約（Revocation）則必須對方收到先至生效。'],

    const INITIAL_QUESTIONS = buildInitial110QuestionPool();

    function create20PracticePaper(questionPool, topicFilter = 'ALL') {
      const filtered = topicFilter === 'ALL' ? questionPool : questionPool.filter(q => q.topicId === topicFilter);
      const source = filtered.length >= 20 ? filtered : questionPool;
      const aiQs = source.filter(q => q.isAI);
      const otherQs = shuffleArray(source.filter(q => !q.isAI));
      return [...aiQs, ...otherQs].slice(0, 20);
    }

    function create110ExamConfig(questionPool) {
      const aiQs = questionPool.filter(q => q.isAI);
      const otherQs = shuffleArray(questionPool.filter(q => !q.isAI));
      let combined = [...aiQs, ...otherQs];
      while (combined.length < 110 && INITIAL_QUESTIONS.length > 0) {
        combined = [...combined, ...shuffleArray(INITIAL_QUESTIONS)];
      }
      const paperQuestions = shuffleArray(combined.slice(0, 110));
      const indices = Array.from({ length: paperQuestions.length }, (_, i) => i);
      const shuffledIndices = shuffleArray(indices);
      const unscoredSet = new Set(shuffledIndices.slice(0, Math.min(10, paperQuestions.length)));
      const scoredMap = {};
      paperQuestions.forEach((q, idx) => {
        scoredMap[q.id] = !unscoredSet.has(idx);
      });
      return { paperQuestions, scoredMap };
    }

    async function callGeminiAPIWithKey(userApiKey, prompt, systemInstruction, responseSchema = null) {
      if (!userApiKey || !userApiKey.trim()) {
        throw new Error('NO_API_KEY');
      }
      const cleanKey = userApiKey.trim();
      const modelsToTry = ['gemini-2.5-flash', 'gemini-2.0-flash'];
      let lastError = null;

      for (const modelName of modelsToTry) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(cleanKey)}`;
        const payload = {
          contents: [{ parts: [{ text: prompt }] }],
          systemInstruction: { parts: [{ text: systemInstruction }] }
        };
        if (responseSchema) {
          payload.generationConfig = {
            responseMimeType: 'application/json',
            responseSchema
          };
        }

        const delays = [1500, 3500];
        for (let attempt = 0; attempt <= delays.length; attempt++) {
          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (response.status === 429) {
              throw new Error('RATE_LIMIT_429: 免費 API 達到每分鐘請求上限 (MAX RPM)，請稍候片刻或改用「📋 Gemini App 免 API 貼上模式」！');
            }
            if (!response.ok) {
              const errText = await response.text();
              throw new Error(`HTTP ${response.status}: ${errText.slice(0, 120)}`);
            }

            const data = await response.json();
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) throw new Error('Empty response from Gemini API');
            return responseSchema ? JSON.parse(text) : text;
          } catch (err) {
            lastError = err;
            if (err.message.includes('RATE_LIMIT_429') && attempt < delays.length) {
              await new Promise(res => setTimeout(res, 6000));
              continue;
            }
            if (attempt < delays.length) {
              await new Promise(res => setTimeout(res, delays[attempt]));
            }
          }
        }
      }
      throw lastError || new Error('Failed to call Gemini API');
    }

    function extractJsonArrayFromRawText(rawText) {
      if (!rawText || !rawText.trim()) throw new Error('請先貼上 Gemini App 生成嘅內容！');
      let cleaned = rawText.trim()
        .replace(/^```json\s*/i, '')
        .replace(/^```\s*/i, '')
        .replace(/\s*```$/i, '')
        .trim();

      const firstBracket = cleaned.indexOf('[');
      const lastBracket = cleaned.lastIndexOf(']');
      if (firstBracket !== -1 && lastBracket !== -1 && lastBracket > firstBracket) {
        cleaned = cleaned.slice(firstBracket, lastBracket + 1);
      }
      const parsed = JSON.parse(cleaned);
      if (!Array.isArray(parsed)) throw new Error('JSON 結構必須係一個 Array ([ ... ])！');
      return parsed;
    }

      const handleDirectApiGenerateQuestions = async (customCount = null, resetPaperAfter = false) => {
        if (!userApiKey) {

          return;

        const totalTarget = customCount || genCount;
        // Use Low-RPM Mega-Batch (up to 20-25 per single API call) so Free Tier MAX RPM is respected!
        const batchSize = 20;

        setIsGeneratingQs(true);
        if (resetPaperAfter) setIsResettingWithAI(true);
        let allAdded = [];
        let runningPool = [...questions];

        try {
          for (let b = 0; b < numBatches; b++) {

              completed: allAdded.length,

            const schema = {
              type: 'ARRAY',
              items: {
                type: 'OBJECT',
                properties: {
                  topicId: { type: 'STRING' },
                  question: { type: 'STRING' },
                  options: { type: 'ARRAY', items: { type: 'STRING' } },
                  correctIndex: { type: 'INTEGER' },
                  enExplanation: { type: 'STRING' },
                  zhExplanation: { type: 'STRING' },
                  trapAnalysis: { type: 'STRING' }
                },
                required: ['topicId', 'question', 'options', 'correctIndex', 'enExplanation', 'zhExplanation', 'trapAnalysis']
              }
            };

            const rawBatch = await callGeminiAPIWithKey(userApiKey, prompt, sys, schema);
            if (Array.isArray(rawBatch) && rawBatch.length > 0) {
              const validTopicIds = ['I', 'II', 'III', 'IV', 'V', 'VI'];
              const formatted = rawBatch.map((q, idx) =>
                normalizeAndBalanceQuestionOptions({
                  id: `q-api-${Date.now()}-${b}-${idx}`,
                  topicId: validTopicIds.includes(q.topicId) ? q.topicId : 'II',
                  difficulty: 'Crisp & Tricky Concept (精煉概念與次序陷阱)',
                  question: q.question,
                  options: q.options.slice(0, 4),
                  correctIndex: Math.min(Math.max(0, Number(q.correctIndex ?? 0)), 3),
                  enExplanation: q.enExplanation,
                  zhExplanation: q.zhExplanation,
                  trapAnalysis: q.trapAnalysis,
                  isAI: true
                })
              );

              const { accepted } = filterAndDeduplicateQuestions(formatted, runningPool, 0.54);
              const useList = accepted.length > 0 ? accepted : formatted;
              allAdded = [...allAdded, ...useList];
              runningPool = [...useList, ...runningPool];
              setQuestions(runningPool);
            }

            if (b < numBatches - 1) {
              await new Promise(r => setTimeout(r, 4000));
            }
          }

          if (resetPaperAfter) {
            setSelectedAnswers({});
            setRevealedQuestions({});
            setFlaggedQIds([]);
            setExamSubmitted(false);
            setCurrentQIndex(0);
            if (mockType === 'daily20') {
              setDaily20Paper(create20PracticePaper(runningPool, examTopicFilter));
              setTimeLeft(20 * SECONDS_PER_QUESTION);

              setTimeLeft(110 * SECONDS_PER_QUESTION);
